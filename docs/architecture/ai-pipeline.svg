<text x="40" y="100" font-size="20" font-weight="400" fill="#344054">Catalogue preparation and joint comparison of three photos</text>
<rect x="1255" y="40" width="42" height="22" rx="5" fill="#FFFFFF" stroke="#334155" stroke-width="2"/>
<text x="1310" y="58" font-size="17" font-weight="400" fill="#1F2937">Live</text>
<rect x="30" y="140" width="1380" height="260" rx="16" fill="#F3F0FF" stroke="#6741D9" stroke-width="2.5"/>
<text x="50" y="178" font-size="25" font-weight="800" fill="#5F3DC4">Prepare catalogue references when the run starts</text>
