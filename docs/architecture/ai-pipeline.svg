<text x="228" y="645" font-size="24" font-weight="700" fill="#1864AB" text-anchor="middle">3</text>
<text x="66" y="706" font-size="16" font-weight="400" fill="#344054">Same product confirmed</text>
<text x="66" y="730" font-size="16" font-weight="400" fill="#344054">by the user.</text>
<rect x="330" y="555" width="220" height="200" rx="10" fill="#FFFFFF" stroke="#0B8A5F" stroke-width="2"/>
<text x="346" y="587" font-size="21" font-weight="700" fill="#087F5B">Inspect all views</text>
<text x="346" y="625" font-size="16" font-weight="400" fill="#344054">Gemini locates the product.</text>
<text x="346" y="649" font-size="16" font-weight="400" fill="#344054">Reads details and labels.</text>
<text x="346" y="673" font-size="16" font-weight="400" fill="#344054">Keeps each view separate.</text>
<rect x="610" y="555" width="220" height="200" rx="10" fill="#FFFFFF" stroke="#0B8A5F" stroke-width="2"/>
