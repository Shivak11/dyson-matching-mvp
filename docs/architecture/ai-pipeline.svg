<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 910" width="1440" height="910" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">How the AI matches three photos of one product</title>
<desc id="desc">Python uses Pillow to resize existing manufacturer photos and arrange a reference sheet for each model. Brochure details are supplied as text. Gemini inspects all three user photos together, then compares all three against those catalogue references. Python validates the structured result and saves one identification with view-specific evidence.</desc>
<metadata id="architecture-facts">{
  "model": "google/gemini-3.7-flash",
  "provider": "openrouter",
  "reasoning": "high",
  "reference_tile_size": 640,
  "reference_columns": 3,
  "product_views": 3,
  "inventory_all_views": true,
  "comparison_all_views_and_references": true,
  "image_tool": "Pillow",
  "strict_json_schema": true
}</metadata>
<defs>
<marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1971C2"/></marker>
<marker id="a-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E8590C"/></marker>
<marker id="a-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0B8A5F"/></marker>
