<text x="906" y="625" font-size="16" font-weight="400" fill="#344054">Python checks JSON</text>
<text x="906" y="649" font-size="16" font-weight="400" fill="#344054">and visible evidence.</text>
<text x="906" y="673" font-size="16" font-weight="400" fill="#344054">Keeps view-specific details.</text>
<rect x="1170" y="555" width="220" height="200" rx="10" fill="#FFFFFF" stroke="#4263EB" stroke-width="2"/>
<text x="1186" y="587" font-size="21" font-weight="700" fill="#364FC7">Identification</text>
<text x="1186" y="625" font-size="16" font-weight="400" fill="#344054">Model family, if resolved.</text>
<text x="1186" y="649" font-size="16" font-weight="400" fill="#344054">Confidence + evidence.</text>
<text x="1186" y="673" font-size="16" font-weight="400" fill="#344054">Missing details if unsure.</text>
