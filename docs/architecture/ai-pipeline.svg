<text x="66" y="232" font-size="21" font-weight="700" fill="#5F3DC4">Manufacturer catalogue</text>
<text x="66" y="270" font-size="16" font-weight="400" fill="#344054">Real photos of each model from useful angles.</text>
<text x="66" y="294" font-size="16" font-weight="400" fill="#344054">Model names and brochure details.</text>
<rect x="530" y="200" width="380" height="165" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
<text x="546" y="232" font-size="21" font-weight="700" fill="#D9480F">Python prepares references</text>
<text x="546" y="270" font-size="16" font-weight="400" fill="#344054">Resize existing photos with Pillow.</text>
<text x="546" y="294" font-size="16" font-weight="400" fill="#344054">Arrange one reference sheet per model.</text>
<text x="546" y="318" font-size="16" font-weight="400" fill="#344054">Keep brochure details as supplied text.</text>
