<text x="626" y="625" font-size="16" font-weight="400" fill="#344054">All 3 photos + catalogue.</text>
<text x="626" y="649" font-size="16" font-weight="400" fill="#344054">Check body, controls,</text>
<text x="626" y="673" font-size="16" font-weight="400" fill="#344054">labels and contradictions.</text>
<rect x="890" y="555" width="220" height="200" rx="10" fill="#FFFFFF" stroke="#E8590C" stroke-width="2"/>
