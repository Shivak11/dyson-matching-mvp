<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1510" width="1440" height="1510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Dyson photo matching: deployed system architecture</title>
<desc id="desc">Staff use a browser to upload store photographs or manufacturer references. A Cloudflare Worker checks access and forwards requests through the PhotoDemo Durable Object to a Python container. Two background workers use Gemini through OpenRouter, validate structured JSON, save results in SQLite and files, and checkpoint private state in Cloudflare R2. A five-step trace follows the actual upload 12807_2_8.jpg. Full request logging is switched off.</desc>
<metadata id="architecture-facts">{
  "release_image_sha256": "e5289555f5c91a9206d3145675dc66f622c095bc4f1becd0d4bdc97194341ee1",
  "verified_date": "2026-10-21",
  "worker": "multiplier-photo-demo",
  "durable_object": "PhotoDemo",
  "container_instances": 1,
  "port": 8080,
  "background_workers": 2,
  "max_inflight": 2,
  "launch_gap_seconds": 15,
  "max_product_views": 3,
  "model": "google/gemini-3.7-flash",
  "reasoning": "high",
  "provider": "openrouter",
  "provider_route": [
    "google-ai-studio"
  ],
  "strict_json_schema": true,
  "provider_fallback": false,
  "request_logging": false,
  "private_lifecycle_events": true,
  "r2_bucket": "multiplier-photo-demo-state",
  "checkpoint_key": "demo/state.tar.gz",
  "working_database": "var/app.sqlite3",
  "working_files": [
    "var/media",
    "var/jobs",
    "var/runtime"
  ],
  "trace_photo": "12807_2_8.jpg",
  "trace_job": "8dd0f136b5024295885f96c92253daf0",
  "joint_views": true
}</metadata>
