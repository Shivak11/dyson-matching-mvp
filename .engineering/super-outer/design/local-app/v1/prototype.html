<style>
:root{--paper:#fff;--canvas:#f6f6f3;--ink:#20241f;--muted:#686f67;--line:#dce0d8;--blue:#2457bc;--bluewash:#edf2fc;--green:#236a43;--greenwash:#edf5ee;--amber:#8a5a12;--amberwash:#fff6e6;--red:#a13131;--radius:6px;--focus:0 0 0 3px #a9c5ff;font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:14px}*{box-sizing:border-box}body{margin:0;background:var(--canvas)}button,input,textarea,select{font:inherit}button,a,summary{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:var(--radius);padding:10px 14px;min-height:40px;font-weight:600;color:var(--ink)}button:hover{background:#f1f3ef}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--blue);border-color:var(--blue);color:white}.primary:hover{background:#19449c}.quiet{border-color:transparent;background:transparent}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--blue);outline-offset:3px}a{color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-size:26px;letter-spacing:-.7px;line-height:1.3}h2{font-size:18px;letter-spacing:-.3px}h3{font-size:15px}p{line-height:1.55}small,.small{font-size:12px}.muted{color:var(--muted)}.previewbar{height:32px;background:#e9edf5;border-bottom:1px solid #ced7e9;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px;color:#405477}.previewbar select{font-size:12px;background:transparent;border:0;color:#405477;max-width:190px}.topbar{display:flex;align-items:center;gap:38px;min-height:76px;padding:0 28px;background:white;border-bottom:1px solid var(--line)}.brand{font-weight:750;font-size:20px;letter-spacing:-.5px}.brand span{font-weight:400;color:var(--muted);font-size:14px;margin-left:14px;letter-spacing:0}.topbar nav{display:flex;gap:6px;align-self:stretch}.topbar nav button{border:0;border-radius:0;background:transparent;color:var(--muted);font-weight:400;padding:0 13px;position:relative}.topbar nav button.active{color:var(--ink);font-weight:600}.topbar nav button.active:after{content:'';position:absolute;bottom:-1px;left:12px;right:12px;height:3px;background:var(--blue)}.local{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted)}.local:before{content:'';display:inline-block;background:#739b76;width:7px;height:7px;border-radius:50%;margin-right:7px}.layout{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 108px)}aside{background:white;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:18px}.asidetitle{display:flex;align-items:center;justify-content:space-between;padding:0 8px}.asidetitle h2{font-size:14px}.count{font-size:12px;color:var(--muted)}.upload{width:100%;display:flex;align-items:center;justify-content:center;gap:8px}.plus{font-size:20px;font-weight:400;line-height:1}.queueitem{display:flex;text-align:left;width:100%;gap:11px;padding:10px;border-color:var(--blue);background:var(--bluewash)}.queueitem img{width:46px;height:52px;object-fit:cover;border-radius:3px}.queueitem strong{display:block;font-size:13px;margin-top:4px}.queueitem small{display:block;font-weight:400;margin-top:6px;color:var(--muted)}.asidebottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px 0}.budget{display:flex;justify-content:space-between;margin-bottom:6px}.asideempty{padding:18px 8px;color:var(--muted);line-height:1.6;font-size:13px}.main{padding:29px 32px 40px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px;gap:14px}.heading p{margin-top:7px;color:var(--muted)}.textbutton{color:var(--blue)}.toolbar{display:flex;align-items:center;gap:14px;padding:16px 20px;background:white;border:1px solid var(--line);border-bottom:0;border-radius:6px 6px 0 0}.toolbar label{font-weight:600;font-size:13px}.toolbar select{background:white;border:1px solid var(--line);border-radius:5px;min-height:38px;padding:7px 32px 7 lay:flex;gap:7px;margin-top:15px}.thumbs button{padding:3px;width:44px;height:44px;min-height:44px}.thumbs button:first-child{border-color:var(--blue)}.thumbs img{width:100%;height:100%;object-fit:contain}.evidence{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding:21px 23px;gap:34px}.evidence h3{margin-bottom:13px}.evidence ul{padding:0;margin:0;list-style:none}.evidence li{padding-left:20px;position:relative;margin-bottom:10px;line-height:1.45;font-size:13px}.evidence li:before{content:'✓';position:absolute;left:0;color:var(--green)}.evidence .missing li:before{content:'–';color:var(--muted)}.resultfoot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:13px 22px;gap:14px;color:var(--muted);font-size:12px}.empty{background:white;border:1px dashed #bbc4b5;min-height:450px;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:6px;padding:24px}.empty h2{font-size:22px;margin-bottom:10px}.empty p{max-width:370px;margin:0 auto 22px;color:var(--muted)}.empty .upload{width:auto;margin:auto}.filetypes{margin-top:14px!important;font-size:12px}.selectedlayout{background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden}.selectedlayout .photo{max-height:410px;aspect-ratio:1.9}.runcontrols{padding:24px;display:flex;align-items:flex-end;gap:18px}.field{display:flex;flex-direction:column;gap:8px}.field label{font-size:13px;font-weight:600}.field input,.field select,.field textarea{padding:11px;border:1px solid #c9cec5;background:white;border-radius:5px;min-height:41px;width:100%}.field textarea{min-height:118px;resize:vertical}.runcontrols .field{min-width:230px}.runcontrols button{margin-left:auto}.runinfo{border-top:1px solid var(--line);padding:15px 24px;color:var(--muted);font-size:12px}.statusarea{background:white;border:1px solid var(--line);border-radius:6px;display:grid;grid-template-columns:1fr 1fr;overflow:hidden}.statusphoto img{width:100%;height:100%;object-fit:contain;background:#eeefea}.statustext{padding:38px}.statustext p{margin-top:10px;color:var(--muted)}.steps{list-style:none;padding:0;margin:26px 0}.steps li{padding:13px 0;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.steps li.done:before{content:'✓';color:var(--green);margin-right:10px}.steps li.current{color:var(--blue);font-weight:600}.steps li.current:before{content:'';width:9px;height:9px;display:inline-block;border:2px solid var(--blue);border-top-color:transparent;border-radius:50%;margin-right:10px;animation:spin 1s linear infinite}.errornote{border-left:3px solid var(--red);padding-left:15px;margin:24px 0;color:var(--red)}.tablewrap{background:white;border:1px solid var(--line);border-radius:6px;overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{color:var(--muted);font-weight:400;font-size:12px;background:#fafbf8}th,td{padding:16px 20px;border-bottom:1px solid var(--line);white-space:nowrap}tr:last-child td{border-bottom:0}td{font-size:13px}td img{width:40px;height:50px;object-fit:contain;vertical-align:middle;margin-right:18px}.rowname{font-weight:600}.rowaction{font-size:12px;padding:7px 10px;min-height:34px}.catalogdetails{display:grid;grid-template-columns:1fr 1.1fr;background:white;border:1px solid var(--line);border-radius:6px;overflow:hidden}.catalogdetails .largeproduct{padding:28px;background:#f9faf7}.largeproduct img{height:425px;width:100%;object-fit:contain}.productcopy{padding:30px}.productcopy h1{font-size:25px}.productcopy dl{margin:26px 0;display:grid;grid-template-columns:120px 1fr;font-size:13px;gap:15px}.productcopy dt{color:var(--muted)}.productcopy dd{margin:0;line-height:1.5}.productcopy h3{margin-bottom:12px}.productcopy p{font-size:13px}.addform{background:white;border:1px solid var(--line);padding:28px;border-radius:6px;max-width:840px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.formgrid .full{grid-column:1/-1}.formactions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px;border-top:1px solid var(--line);padding-top:22px}.notice{padding:13px 16px;background:var(--bluewash);color:#3d5686;font-size:12px;margin-top:20px;border-radius:4px}.hidden{display:none!important}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}@media(max-width:1100px){.layout{grid-template-columns:205px minmax(0,1fr)}.main{padding:24px}.brand span{display:none}.topbar{gap:24px}.compare{grid-template-columns:1.25fr 1fr}.refimage{height:190px}.refimage img{height:170px}.toolbar{gap:10px}.toolbar .right{gap:7px}.refcaption{padding:15px}.evidence{gap:22px}}@media(max-width:760px){.previewbar{padding:0 16px}.topbar{padding:0 16px;min-height:100px;flex-wrap:wrap;gap:0}.brand{height:51px;display:flex;align-items:center}.local{height:51px;display:flex;align-items:center}.topbar nav{height:49px;order:3;width:100%;overflow:auto;gap:0}.topbar nav button{padding:0 11px;font-size:13px;white-space:nowrap}.layout{display:block;min-height:calc(100vh - 132px)}aside{display:none}.main{padding:22px 16px}.heading{align-items:flex-start;margin-bottom:20px}.heading h1{font-size:23px}.heading p{font-size:13px}.heading button{padding:9px 10px;font-size:12px}.compare{display:block}.photopanel{border-right:0;border-bottom:1px solid var(--line)}.toolbar{padding:12px;flex-wrap:wrap}.toolbar .right{width:100%;margin:0;border-top:1px solid var(--line);padding-top:10px;justify-content:space-between}.toolbar select{max-width:220px;flex:1}.photo{aspect-ratio:1.55}.reference{display:grid;grid-template-columns:110px 1fr}.reference .paneltitle{display:none}.refimage{height:190px}.refimage img{height:165px}.refcaption{border-top:0;padding:18px 12px}.refcaption h2{font-size:18px}.thumbs{margin-top:10px}.source{word-break:break-word}.evidence{display:block;padding:20px}.evidence>div+div{margin-top:24px}.resultfoot{align-items:flex-start;line-height:1.6;padding:14px 18px}.resultfoot span{max-width:65%}.photofeet{padding:12px}.statusarea{display:block}.statusphoto{height:190px}.statustext{padding:24px}.runcontrols{display:block;padding:20px}.runcontrols button{margin-top:20px;width:100%}.runcontrols .field{min-width:0}.runinfo{padding:15px 20px;line-height:1.6}.catalogdetails{display:block}.largeproduct img{height:230px!important}.productcopy{padding:22px}.formgrid{display:block}.formgrid .field{margin-bottom:20px}.addform{padding:20px}.tablewrap td,.tablewrap th{padding:13px 16px}.empty{min-height:400px}.objecttabs button{padding:7px 8px}.small.narrowhide{display:none}.productcopy dl{grid-template-columns:100px 1fr}}
</style></head><body>
<div class="previewbar"><span>Design preview · Results and saves are simulated</span><label><span class="hidden">Preview state</span><select id="stateSelect" aria-label="Preview state"><option value="result">Completed result</option><option value="empty">Empty upload</option><option value="selected">Selected photo</option><option value="running">Running</option><option value="error">Error and retry</option><option value="catalog">Catalogue</option><option value="detail">Product details</option><option value="add">Add product</option><option value="history">Saved history</option></select></label></div>
<header class="topbar"><div class="brand">Multiplier<span>Photo matching</span></div><nav aria-label="Main navigation"><button data-nav="empty">Match photos</button><button data-nav="catalog">Catalogue</button><button data-nav="history">History</button></nav><div class="local">Local workspace</div></header>
<div class="layout"><aside><div class="asidetitle"><h2>Store photos</h2><span class="count" id="queuecount">1 photo</span></div><button class="upload" data-upload><span class="plus" aria-hidden="true">+</span> Upload photos</button><div id="queue"></div><div class="asidebottom"><div class="budget"><span class="small muted">Run allowance</span><strong class="small">₹100.00</strong></div><p class="small muted">OpenRouter · Gemini Flash<br>Calls start only when you run.</p></div></aside><main class="main" id="main"></main></div><input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
<script>
const data=new URL('../../../../../data/',location.href).href;
const products=[['dyson_v8_absolute','Dyson V8 Absolute','00.png','Cordless vacuum'],['dyson_v12_detect_slim','Dyson V12 Detect Slim','05.png','Cordless vacuum'],['dyson_v15_detect','Dyson V15 Detect','00.png','Cordless vacuum'],['dyson_v16_piston_animal','Dyson V16 Piston Animal','01.png','Cordless vacuum'],['dyson_big_ball','Dyson Big Ball','00.png','Cylinder vacuum'],['dyson_wash_g1','Dyson WashG1','00.png','Wet floor cleaner']];
const img=(i=1)=>data+'catalog/'+products[i][0]+'/'+products[i][2];
const catalogueEvidence={"dyson_big_ball": "Rides on a ball, to steer easily around corners and into difficult places.", "dyson_v8_absolute": "The motor and battery are positioned around the handle, creating the optimum centre of gravity for floor-to-ceiling cleaning.", "dyson_v12_detect_slim": "Single-button power control\nNo need to hold the trigger.", "dyson_v15_detect": "LCD screen intelligently reports in real time", "dyson_v16_piston_animal": "New dual conical cleaner head\nNew compressing bin\nLCD screen for instant feedback", "dyson_wash_g1": "Two motorised counter-rotating microfibre rollers", "dyson_v11": "The motor, bin, and cyclone are aligned", "dyson_gen5detect": "Power at the touch of a button, with no trigger to hold", "shark_stratos": "Shark Stratos Anti Hair Wrap Plus Cordless Vacuum"};
const sample=data+'test/review_photos/P059.jpg'; let store=sample,filename='shop-floor-01.jpg',object=1,timer;
let selectedProduct=1; let state=new URLSearchParams(location.search).get('state')||'result';
const main=document.querySelector('#main');
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function go(s){clearTimeout(timer);state=s;history.replaceState(null,'','?state='+s);render()}
function heading(title,desc,action=''){return `<div class="heading"><div><h1>${title}</h1>${desc?`<p>${desc}</p>`:''}</div>${action}</div>`}
function photo(boxes=false){return `<div class="photo"><img src="${store}" alt="Example photograph containing two upright Dyson vacuum cleaners">${boxes?`<div class="box ${object===1?'selected':''}"><span>1</span></div><div class="box second ${object===2?'selected':''}"><span>2</span></div>`:''}</div>`}
function render(){document.querySelector('#stateSelect').value=state;document.querySelectorAll('[data-nav]').forEach(n=>n.classList.toggle('active',n.dataset.nav===((['catalog','detail','add'].includes(state))?'catalog':state==='history'?'history':'empty')));document.querySelector('#queuecount').textContent=state==='empty'?'0 photos':'1 photo';document.querySelector('#queue').innerHTML=state==='empty'?'<p class="asideempty">Your selected store photos will appear here.</p>':`<button class="queueitem" onclick="go('result')"><img src="${store}" alt=""><span><strong>${escapeText(filename)}</strong><small>${state==='running'?'Comparing references':state==='selected'?'Ready to run':state==='error'?'Needs retry':'2 machines · Complete'}</small></span></button>`;
if(state==='result'){const second=object===2;main.innerHTML=heading(escapeText(filename),'2 machines found in this photograph','<button data-upload>Upload more</button>')+`<section aria-label="Matching result"><div class="toolbar"><label for="objectSelect">Machine</label><select id="objectSelect"><option value="1" ${!second?'selected':''}>1 · Left machine</option><option value="2" ${second?'selected':''}>2 · Right machine</option></select><div class="right"><span class="confidence ${second?'medium':''}">${second?'Moderate confidence':'High confidence'}</span><span class="small muted">Illustrative result</span></div></div><div class="resultbody"><div class="compare"><section class="photopanel"><div class="paneltitle"><span>Store photograph</span><span>Original image</span></div>${photo(true)}<div class="photofeet"><div class="objecttabs"><button class="${!second?'selected':''}" data-object="1">1 · Left machine</button><button class="${second?'selected':''}" data-object="2">2 · Right machine</button></div><span class="small muted narrowhide">Select a box to inspect it</span></div></section><section class="reference"><div class="paneltitle"><span>Manufacturer reference</span><button class="quiet small" onclick="go('detail')">View product ↗</button></div><div class="refimage"><img src="${img(second?2:1)}" alt="Manufacturer image of ${second?'Dyson V15 Detect':'Dyson V12 Detect Slim'}"></div><div class="refcaption"><h2>${second?'Dyson V15 Detect':'Dyson V12 Detect Slim'}</h2><p class="small muted">${second?'Cordless vacuum':'Cordless vacuum · Slim body'}</p><div class="thumbs"><button aria-label="Show full product reference"><img src="${img(second?2:1)}" alt=""></button><button aria-label="Show alternate manufacturer view"><img src="${data}catalog/${second?'dyson_v15_detect/01.jpg':'dyson_v12_detect_slim/01.jpg'}" alt=""></button><button aria-label="Show manufacturer detail"><img src="${data}catalog/${second?'dyson_v15_detect/02.jpg':'dyson_v12_detect_slim/02.jpg'}" alt=""></button></div><p class="source muted">Reference from Dyson India</p></div></section></div><div class="evidence"><div><h3>Details supporting this match</h3><ul><li>${second?'Larger dust bin and body proportions match the V15 reference.':'Red power button is visible on the top of the body.'}</li><li>${second?'Cyclone arrangement agrees with the manufacturer view.':'Slim dust bin and motor housing agree with the reference.'}</li><li>Wand text supports the proposed model.</li></ul></div><div class="missing"><h3>Details that remain unverified</h3><ul><li>${second?'The rear display is not visible in this photograph.':'The model label is not shown closely enough to verify.'}</li><li>Included accessories do not establish the exact retail variant.</li></ul></div></div><div class="resultfoot"><span>Confidence describes the visible evidence. It is not a measured probability.</span><span>Gemini Flash · OpenRouter</span></div></div></section>`}
else if(state==='empty'){main.innerHTML=heading('Match store photos','Identify each machine using your manufacturer catalogue.')+`<section class="empty"><div><h2>Upload a store photograph</h2><p>Choose the photos you want to check. You can inspect them before starting a run.</p><button class="primary upload" data-upload><span class="plus" aria-hidden="true">+</span> Choose photos</button><p class="filetypes">JPEG, PNG or WebP</p></div></section>`}
else if(state==='selected'){main.innerHTML=heading('Review selected photo','Choose what to check, then start the run.','<button onclick="go(\'empty\')">Remove photo</button>')+`<section class="selectedlayout"><div class="paneltitle"><span>${escapeText(filename)}</span><span>Ready to run</span></div>${photo()}<div class="runcontrols"><div class="field"><label for="mode">What should we check?</label><select id="mode"><option>Identify from the catalogue</option><option>Verify an expected model</option></select></div><div class="field hidden" id="expected"><label for="expectedmodel">Expected model</label><select id="expectedmodel">${products.map(p=>`<option>${p[1]}</option>`).join('')}</select></div><button class="primary" onclick="go('running');timer=setTimeout(()=>go('result'),5000)">Run matching</button></div><div class="runinfo">Gemini Flash through OpenRouter · ₹100.00 available for runs · This preview does not make model calls.</div></section>`}
else if(state==='running'||state==='error'){const error=state==='error';main.innerHTML=heading(escapeText(filename),error?'The photo is saved. Matching did not complete.':'Matching is running. You can return to this job from History.')+`<section class="statusarea"><div class="statusphoto"><img src="${store}" alt="Selected store photograph"></div><div class="statustext"><h2>${error?'OpenRouter rate limit reached':'Comparing manufacturer references'}</h2>${error?'<div class="errornote"><p>The retry limit was reached. Wait before starting another run.</p></div><p>Your photograph and the request record are preserved.</p><div style="display:flex;gap:9px;margin-top:25px"><button class="primary" onclick="go(\'running\');timer=setTimeout(()=>go(\'result\'),5000)">Retry as a new run</button><button onclick="go(\'history\')">View history</button></div>':'<ol class="steps"><li class="done">Photo saved</li><li class="done">Machines located</li><li class="current">Checking model details</li><li>Preparing the result</li></ol><p class="small">One request at a time. Job continues if you leave this page.</p><button style="margin-top:22px" onclick="go(\'history\')">View history</button>'}</div></section>`}
else if(state==='catalog'){main.innerHTML=heading('Manufacturer catalogue','6 products with reference images and brochure details.','<button class="primary" onclick="go(\'add\')">+ Add product</button>')+`<div class="tablewrap"><table><thead><tr><th>Product</th><th>Type</th><th>Reference images</th><th>Source</th><th></th></tr></thead><tbody>${products.map((p,i)=>`<tr><td class="rowname"><img src="${img(i)}" alt="">${p[1]}</td><td>${p[3]}</td><td>3 images</td><td>Dyson India</td><td><button class="rowaction" data-product="${i}">View details</button></td></tr>`).join('')}</tbody></table></div>`}
else if(state==='detail'){const product=products[selectedProduct];const pages=['dyson-v8-absolute-vacuum','dyson-v12-detect-slim-vacuum-cleaner','dyson-v15-detect-vacuum-cleaner','v16-piston-animal-cordless-vacuum','big-ball-vacuum','washg1-wet-cleaner-blue-black'];main.innerHTML=heading(product[1],'Manufacturer images and product details.','<button onclick="go(\'catalog\')">Back to catalogue</button>')+`<section class="catalogdetails"><div class="largeproduct"><img src="${img(selectedProduct)}" alt="${product[1]} manufacturer photograph"></div><div class="productcopy"><h1>${product[1]}</h1><p class="muted" style="margin-top:8px">${product[3]}</p><dl><dt>Manufacturer</dt><dd>Dyson</dd><dt>Source</dt><dd><a href="https://www.dyson.in/${pages[selectedProduct]}" target="_blank" rel="noreferrer">Dyson India ↗</a></dd><dt>References</dt><dd>3 manufacturer images</dd><dt>Brochure</dt><dd>No PDF added</dd></dl><h3>Product details</h3><p>${escapeText(catalogueEvidence[product[0]]||'No brochure details have been added.')}</p><div class="thumbs"><button aria-label="Full manufacturer image"><img src="${img(1)}" alt=""></button><button aria-label="Manufacturer side view"><img src="${data}catalog/dyson_v12_detect_slim/01.jpg" alt=""></button><button aria-label="Manufacturer lifestyle view"><img src="${data}catalog/dyson_v12_detect_slim/02.jpg" alt=""></button></div><button style="margin-top:27px" onclick="go('add')">Edit details / add material</button></div></section>`}
else if(state==='add'){main.innerHTML=heading('Add manufacturer product','Store its details and reference material in the local catalogue.','<button onclick="go(\'catalog\')">Cancel</button>')+`<form class="addform" id="productForm"><div class="formgrid"><div class="field"><label for="productName">Product name</label><input id="productName" name="productName" required placeholder="e.g. Dyson V12 Detect Slim"></div><div class="field"><label for="maker">Manufacturer</label><input id="maker" required value="Dyson"></div><div class="field full"><label for="source">Manufacturer source URL</label><input type="url" id="source" required placeholder="https://www.dyson.in/…"></div><div class="field full"><label for="details">Brochure / product details</label><textarea id="details" placeholder="Paste the manufacturer’s product details."></textarea></div><div class="field"><label for="refs">Manufacturer images</label><input id="refs" type="file" accept="image/*" multiple></div><div class="field"><label for="pdf">Brochure PDF (optional)</label><input id="pdf" type="file" accept="application/pdf"></div></div><p class="notice">Design preview. Saving demonstrates the flow and does not write to a database.</p><div class="formactions"><button type="button" onclick="go('catalog')">Cancel</button><button class="primary" type="submit">Save product</button></div><p id="saveFeedback" role="status" class="small" style="margin-top:14px"></p></form>`}
else if(state==='history'){main.innerHTML=heading('Saved runs','Reopen a photograph to inspect its result.','<button data-upload>Upload photos</button>')+`<div class="tablewrap"><table><thead><tr><th>Photograph</th><th>Saved</th><th>Result</th><th>Cost</th><th></th></tr></thead><tbody><tr><td class="rowname"><img src="${sample}" alt="">shop-floor-01.jpg</td><td>Today, 10:42</td><td>2 machines · Complete</td><td>₹1.84</td><td><button class="rowaction" onclick="go('result')">Open result</button></td></tr><tr><td class="rowname">display-closeup.jpg</td><td>Today, 10:36</td><td><span class="confidence neutral">Interrupted</span></td><td>Reserved</td><td><button class="rowaction" onclick="go('error')">Review run</button></td></tr></tbody></table></div><p class="notice">Design preview. History entries, costs and timestamps are simulated.</p>`}
bind();}
function bind(){document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>document.querySelector('#fileInput').click());document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{object=Number(b.dataset.object);render()});document.querySelectorAll('.box').forEach((b,i)=>b.onclick=()=>{object=i+1;render()});const s=document.querySelector('#objectSelect');if(s)s.onchange=()=>{object=Number(s.value);render()};const mode=document.querySelector('#mode');if(mode)mode.onchange=()=>document.querySelector('#expected').classList.toggle('hidden',mode.selectedIndex===0);document.querySelectorAll('[data-product]').forEach(b=>b.onclick=()=>{selectedProduct=Number(b.dataset.product);go('detail')});const form=document.querySelector('#productForm');if(form)form.onsubmit=e=>{e.preventDefault();document.querySelector('#saveFeedback').textContent='Preview saved. No database was changed.'};document.querySelectorAll('.thumbs button').forEach(b=>b.onclick=()=>{const target=document.querySelector('.refimage img,.largeproduct img');if(target)target.src=b.querySelector('img').src})}
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));document.querySelector('#stateSelect').onchange=e=>go(e.target.value);document.querySelector('#fileInput').onchange=e=>{const f=e.target.files[0];if(f){store=URL.createObjectURL(f);filename=f.name;go('selected')}};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='add')go('catalog')});render();
</script></body></html>
