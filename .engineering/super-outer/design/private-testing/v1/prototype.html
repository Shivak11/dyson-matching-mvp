function heading(t,d,a=''){return `<div class="heading"><div><h1>${t}</h1>${d?`<p>${d}</p>`:''}</div>${a}</div>`}
function exports(){return `<div class="exports"><a href="#" class="button" data-download="json">Download JSON</a><a href="#" class="button" data-download="csv">Download CSV</a></div>`}
function runDetails(open=false){return `<details class="rundetails" ${open?'open':''}><summary>Run details</summary><dl><dt>Elapsed time</dt><dd>24.8 seconds</dd><dt>Queue time</dt><dd>0.4 seconds</dd><dt>Started</dt><dd>16 October 2026, 14:20:00</dd><dt>Completed</dt><dd>16 October 2026, 14:20:25</dd><dt>Configured model</dt><dd>Fixture vision model</dd><dt>Configured provider</dt><dd>OpenRouter</dd><dt>Reasoning</dt><dd>High</dd><dt>Configuration version</dt><dd>Fixture pipeline v1<br>Configuration SHA-256: ${'b7'.repeat(32)}</dd><dt>Catalogue snapshot</dt><dd>SHA-256: ${'c4'.repeat(32)}</dd><dt>Cost recorded</dt><dd>₹1.84, reported usage</dd></dl><div class="tablewrap" role="region" aria-label="Request cost records" tabindex="0"><table><thead><tr><th>Request</th><th>Actual model</th><th>Actual provider</th><th>Time</th><th>Charged USD</th><th>Reserved USD</th></tr></thead><tbody><tr><td>Locate machines</td><td>Fixture vision model</td><td>Fixture provider A</td><td>6.1 s</td><td>$0.004</td><td>None</td></tr><tr><td>Check model details</td><td>Fixture vision model</td><td>Fixture provider A</td><td>18.2 s</td><td>$0.018</td><td>None</td></tr></tbody></table></div></details>`}
function img(boxes=false){return `<div class="photo"><img src="${photo}" alt="Fixture photograph containing two upright vacuum cleaners">${boxes?`<button class="box first ${object===1?'selected':''}" data-object="1" aria-label="Select machine 1" aria-pressed="${object===1}"><span>1</span></button><button class="box second ${object===2?'selected':''}" data-object="2" aria-label="Select machine 2" aria-pressed="${object===2}"><span>2</span></button>`:''}</div>`}
function modeHelp(){return `<div class="modehelp"><p>Identify finds the catalogue model for each machine.</p><p>Verify checks whether each machine matches the model you select.</p></div>`}
function render(){
 q('#stateSelect').value=state;
 document.querySelectorAll('[data-nav]').forEach(b=>{const on=b.dataset.nav===(state==='history'?'history':state==='catalogue'?'catalogue':'empty');b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
 q('#queueCount').textContent=state==='empty'?'0 photos':'1 photo';
 q('#queue').innerHTML=state==='empty'?'<p class="asideempty">Your store photos will appear here.</p>':`<button class="queueitem selected" data-go="${state==='running'?'running':'result'}"><img src="${photo}" alt=""><span><strong>fixture-shop-floor.jpg</strong><small>${state==='running'?'Checking model details':state==='error'?'Failed':state==='selected'?'Ready to run':'2 machines · Complete'}</small></span></button>`;
 if(['result','details','not-sure','outside'].includes(state)){
 const unsure=state==='not-sure'||object===2, outside=state==='outside';
 const name=outside?'Not in catalogue':unsure?'Not sure':'Dyson V12 Detect Slim';
 const retake=outside?'Photograph the model label and the full machine in the same lighting.':unsure?`Photograph machine ${object} from behind so the display and model label are readable.`:'Take a close photograph of machine 1’s model label to check the exact variant.';
 main.innerHTML=heading('fixture-shop-floor.jpg','2 machines found in this photograph.',`<button data-go="selected">Upload more</button>`)+`<div class="savedactions"><p>Completed · ${mode==='verify'?'Verify':'Identify'}</p>${exports()}</div><section aria-label="Matching result"><div class="toolbar"><label for="objectSelect">Machine</label><select id="objectSelect"><option value="1" ${object===1?'selected':''}>1 · Left machine</option><option value="2" ${object===2?'selected':''}>2 · Right machine</option></select><div class="right"><span class="confidence ${unsure||outside?'neutral':''}">${outside?'Not in catalogue':unsure?'Not sure':'Match · High confidence'}</span><span class="small muted">Fixture result</span></div></div><div class="resultbody"><div class="compare"><section class="photopanel"><div class="paneltitle"><span>Store photograph</span><span>Original image</span></div>${img(true)}<div class="photofeet"><div class="objecttabs"><button data-object="1" class="${object===1?'selected':''}" aria-pressed="${object===1}">Machine 1</button><button data-object="2" class="${object===2?'selected':''}" aria-pressed="${object===2}">Machine 2</button></div><span class="small muted narrowhide">Select a box to inspect it</span></div></section><section class="reference"><div class="paneltitle">Manufacturer reference</div>${outside||unsure?'<div class="no-reference"><p class="muted">No manufacturer match established.</p></div>':`<div class="refimage"><img src="assets/v12.png" alt="Dyson V12 Detect Slim manufacturer reference"></div>`}<div class="refcaption"><h2>${name}</h2>${mode==='verify'?`<p class="verification">${unsure||outside?'Cannot verify the selected model':'Matches the selected model'}</p><p class="small muted">Selected model: Dyson V12 Detect Slim</p>`:''}<p class="small muted">${outside?'The visible machine is outside the current catalogue.':unsure?'The visible details do not establish one model.':'Cordless vacuum · Slim body'}</p>${!unsure&&!outside?'<p class="source muted">Reference from Dyson India</p>':''}</div></section></div><div class="evidence"><div><h3>Details supporting this result</h3><ul><li>${outside?'Body shape differs from the catalogue references.':unsure?'Cordless body and cyclone arrangement are visible.':'Red power button is visible on top of the body.'}</li><li>${outside||unsure?'The full machine is visible.':'Slim dust bin agrees with the manufacturer reference.'}</li></ul></div><div class="missing"><h3>Details that remain unverified</h3><ul><li>${unsure?'The rear display and model label are not readable.':'The model label is not readable.'}</li><li>Accessories do not establish the exact retail variant.</li></ul></div></div><section class="retake"><h3>Retake guidance for machine ${object}</h3><ul><li>${retake}</li></ul><p class="small muted">You can inspect and download this result without another photo.</p></section><div class="resultfoot"><span>Confidence describes the visible evidence. It is not a measured probability.</span></div></div></section>${runDetails(state==='details')}`;
 }else if(state==='empty'){
 main.innerHTML=heading('Match store photos','Identify each machine using your manufacturer catalogue.')+`<section class="empty"><div><h2>Upload store photographs</h2><p>Choose one to five photos. Inspect the previews before starting a run.</p><button class="primary" data-go="selected">Choose photos</button><p class="filetypes">JPEG, PNG or WebP</p></div></section><div style="margin-top:20px">${modeHelp()}</div>`;
 }else if(state==='selected'){
 main.innerHTML=heading('Review selected photo','Choose what to check, then start the run.',`<button data-go="empty">Remove photo</button>`)+`<section class="selectedlayout"><div class="paneltitle"><span>fixture-shop-floor.jpg</span><span>Ready to run</span></div>${img()}<div class="runcontrols"><div class="field"><label for="mode">What should we check?</label><select id="mode"><option value="identify" ${mode==='identify'?'selected':''}>Identify from the catalogue</option><option value="verify" ${mode==='verify'?'selected':''}>Verify a selected model</option></select></div><div class="field ${mode==='verify'?'':'hidden'}" id="expected"><label for="expectedModel">Claimed model</label><select id="expectedModel"><option value="">Choose a model</option><option>Dyson V12 Detect Slim</option><option>Dyson V15 Detect</option></select></div><button class="primary" id="run" ${mode==='verify'?'disabled':''} data-go="running">Run matching</button></div>${modeHelp()}<div class="runinfo">₹98.16 available for runs. A run starts only when you choose Run matching.</div></section>`;
 }else if(state==='running'||state==='error'){
 const fail=state==='error';
 main.innerHTML=heading('fixture-shop-floor.jpg',fail?'Matching did not complete. Your photograph is saved.':'Matching is running. You can reopen this run from History.')+`<section class="statusarea"><div class="statusphoto"><img src="${photo}" alt="Saved fixture photograph"></div><div class="statustext"><h2>${fail?'Provider request failed':'Checking model details'}</h2>${fail?'<div class="errornote" role="alert"><p>The provider did not complete the request.</p></div><p>Your photograph and the failed run record are preserved.</p><p>A new run may use the remaining allowance. Review the photo before starting it.</p><div class="buttonrow"><button class="primary" data-go="selected">Review photo for a new run</button><button data-go="history">View history</button></div>':'<p>Elapsed time: 18 seconds</p><ol class="steps"><li class="done">Photo saved</li><li class="done">Machines located</li><li class="current">Checking model details</li><li>Preparing the result</li></ol><p class="small">The run continues if you leave this page.</p><button data-go="history" style="margin-top:22px">View history</button>'}<p class="unavailable" style="margin-top:20px">Downloads become available when a saved prediction is ready.</p></div></section><details class="rundetails"><summary>Run details</summary><dl><dt>Elapsed time</dt><dd>${fail?'19.2':'18'} seconds</dd><dt>Configured model</dt><dd>Fixture vision model</dd><dt>Configured provider</dt><dd>OpenRouter</dd><dt>Cost recorded</dt><dd>Unknown charge · $0.03 reserved</dd></dl></details>`;
 }else if(state==='history'){
 main.innerHTML=heading('History','Reopen a saved run or download its prediction.',`<button data-go="selected">Upload photos</button>`)+`<div class="tablewrap" role="region" aria-label="Saved runs" tabindex="0"><table><thead><tr><th>Photograph</th><th>Saved</th><th>Result</th><th>Actions</th></tr></thead><tbody><tr><td class="rowname">fixture-shop-floor.jpg</td><td>16 Oct, 14:20</td><td>2 machines · Complete</td><td><button data-go="result">Open result</button>${exports()}</td></tr><tr><td class="rowname">fixture-display.jpg</td><td>16 Oct, 14:18</td><td>Checking model details</td><td><button data-go="running">Open run</button><p class="unavailable">Downloads await a saved prediction.</p></td></tr><tr><td class="rowname">fixture-side-view.jpg</td><td>16 Oct, 14:12</td><td>Failed</td><td><button data-go="error">Review run</button><p class="unavailable">No saved prediction is available.</p></td></tr></tbody></table></div>`;
 }else{main.innerHTML=heading('Manufacturer catalogue','The existing catalogue screen is retained.')+`<p class="callout">This design fixture covers the requested testing additions. Catalogue editing uses the existing app.</p><button data-go="result">Return to result</button>`}
 bind();
}
function bind(){
 document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>{object=+b.dataset.object;render()});
 if(q('#objectSelect'))q('#objectSelect').onchange=e=>{object=+e.target.value;render();q('#objectSelect').focus()};
 if(q('#mode'))q('#mode').onchange=e=>{mode=e.target.value;render();q('#mode').focus()};
 if(q('#expectedModel'))q('#expectedModel').onchange=e=>q('#run').disabled=!e.target.value;
 document.querySelectorAll('[data-download]').forEach(a=>a.onclick=e=>{e.preventDefault();q('#announcer').textContent='Simulated download selected. No saved prediction was downloaded.';alert('Design fixture: the production action downloads the saved '+a.dataset.download.toUpperCase()+' prediction.');});
}
q('#stateSelect').onchange=e=>go(e.target.value);
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>go(b.dataset.nav));
render();
</script></body></html>
